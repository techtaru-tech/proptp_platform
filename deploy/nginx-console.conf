# /etc/nginx/conf.d/console-rosium.conf
#
# One server block for both halves: the built frontend is served as static files,
# and anything under /api (plus /uploads) is proxied to the Node process.
# certbot rewrites this file to add the 443 block and the redirect.

server {
    listen 80;
    server_name console.rosium.in;

    root /home/ec2-user/rosium/dist;
    index index.html;

    # KYC documents, project images, cheque photos. Served straight off disk.
    location /uploads/ {
        alias /home/ec2-user/rosium/server/uploads/;
        expires 30d;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Meta/Airphone/Brevo webhooks and file uploads both need room.
        client_max_body_size 20m;
        proxy_read_timeout 60s;
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html names the hashed bundle, so it must never be cached — otherwise a browser
    # keeps loading yesterday's app long after a deploy and the fix "did not work".
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # React Router owns every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
