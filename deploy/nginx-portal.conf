# /etc/nginx/conf.d/techtaru-portal.conf
#
# One server block for both halves: the built frontend is served as static files, and
# anything under /api (plus /uploads) is proxied to the Node process on 127.0.0.1:4600.
# certbot rewrites this file to add the 443 block and the redirect.

server {
    server_name portal.techtaru.in;

    root /home/ec2-user/techtaru-portal/dist;
    index index.html;

    # KYC documents, project images, cheque photos. Served straight off disk.
    location /uploads/ {
        alias /home/ec2-user/techtaru-portal/server/uploads/;
        expires 30d;
        access_log off;
    }

    # Reading a plot-map layout with the AI is one long request (a map with a hundred plots can
    # take over a minute), so this one path is allowed to wait.
    location ~ ^/api/project-maps/[^/]+/read$ {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Meta/DeepCall/Brevo webhooks and file uploads both need room.
        client_max_body_size 20m;
        proxy_read_timeout 60s;
    }

    # nginx's stock mime table has no .mjs, and a browser refuses a module script that is not
    # JavaScript — the PDF reader's worker is one.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html names the hashed bundle, so it must never be cached — otherwise a browser
    # keeps loading yesterday's app long after a deploy and the fix "did not work".
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # React Router owns every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
}
